services:
  mock-server:
    build: ./mock-server
    ports:
      - "${MOCK_SERVER_PORT:-8002}:8002"
    environment:
      - PORT=8002
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 5s
      timeout: 3s
      retries: 3
