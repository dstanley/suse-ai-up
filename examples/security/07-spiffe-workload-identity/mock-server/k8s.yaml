apiVersion: apps/v1
kind: Deployment
metadata:
  name: spiffe-mock-server
  labels:
    app: spiffe-mock-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spiffe-mock-server
  template:
    metadata:
      labels:
        app: spiffe-mock-server
    spec:
      containers:
        - name: mock-server
          image: python:3.12-slim
          command: ["python3", "/app/server.py"]
          ports:
            - containerPort: 8002
          env:
            - name: PORT
              value: "8002"
          volumeMounts:
            - name: server-script
              mountPath: /app
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: server-script
          configMap:
            name: spiffe-mock-server
---
apiVersion: v1
kind: Service
metadata:
  name: spiffe-mock-server
  labels:
    app: spiffe-mock-server
spec:
  selector:
    app: spiffe-mock-server
  ports:
    - port: 8002
      targetPort: 8002
      protocol: TCP
